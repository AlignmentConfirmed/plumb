# plumb — the workspace. Three crates, one law each:
#
#     isthmus  ->  nothing              the substrate (carries, never reads)
#     assay    ->  nothing              the verification physics
#     datum    ->  isthmus + assay      the court (reads, never carried)
#
# Nothing here reaches outside this directory. Kernel-edge measurements
# (xylarium, netstratum) live in the lab, which depends on these crates
# the same way any outsider would.
[workspace]
resolver = "2"
members = ["crates/isthmus", "crates/assay", "crates/datum"]
