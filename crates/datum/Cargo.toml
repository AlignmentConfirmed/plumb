[package]
name = "plumb-datum"
version = "0.1.0"
edition = "2021"
description = "The court of the proof economy: priced space, work-identity rewards, funded settlement, the founding chain."
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlignmentConfirmed/plumb"
keywords = ["settlement", "ledger", "proof", "pouw"]

# The package is namespaced for the registry; the library keeps its
# name, so code says `use datum::` and the docs stay true.
[lib]
name = "datum"

# datum imports the substrate and the physics, and is imported by
# nothing. That is what makes it the datum: a court a kernel can link
# against is a court a kernel can lobby.
#
# This crate is edge-free by construction. Kernel-edge measurements (the
# crossing suites) live in a separate lab repository, which depends on
# these crates the way any outsider would.
[dependencies]
isthmus = { path = "../isthmus", package = "plumb-isthmus" }
assay = { path = "../assay", package = "plumb-assay" }
sig = { path = "../sig", package = "plumb-sig" }
# K1: Query/Conjecture/Receipt live in the leaf-importable sdk crate
# now (a kernel may need them without linking the court); datum
# re-exports `query`/`receipt` so every existing `datum::query::*` /
# `datum::receipt::*` path keeps resolving unchanged. sdk's own
# dev-dependency on datum (its in-process example) stays dev-only, so
# this does not close a cycle.
sdk = { path = "../sdk", package = "plumb-sdk" }
num-rational = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
# PR4 — transport confidentiality (IS-6/6). TLS buys the channel;
# identity stays the Ed25519 attestation's job, never rustls's — the
# custom verifier in tls.rs checks a fingerprint against chain state,
# not a CA chain.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "=0.13.2"
# The signature-verification primitive a custom ServerCertVerifier
# needs (checking a TLS handshake signature against a cert's embedded
# key) without pulling in CA/chain validation. rustls already depends
# on this crate internally; naming it directly gives tls.rs the same
# public API rustls's own stock verifier is built on.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "ring"] }

[lints.rust]
unsafe_code = "forbid"

# A reference to something that no longer exists is a stale reference,
# and rustdoc checks it against what exists.
[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

# The library is total: every path returns. Tests are allowed to panic,
# because a test that cannot reach its subject must say so loudly
# rather than pass quietly.
[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
